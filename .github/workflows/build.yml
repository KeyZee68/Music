name: Build APK
on:
  workflow_dispatch:
  push:
    paths: ["Vortera27.zip"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - run: unzip -q Vortera27.zip
      - name: Build
        run: cd Vortera27 && gradle assembleRelease --no-daemon -Pvc=${{ github.run_number }} -Psburl="${{ secrets.SUPABASE_URL }}" -Psbkey="${{ secrets.SUPABASE_KEY }}" -Pytkey="${{ secrets.YT_API_KEY }}"
      - run: cp Vortera27/app/build/outputs/apk/release/app-release.apk Vortera27.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Vortera27 v${{ github.run_number }}
          files: Vortera27.apk
          make_latest: true
          
